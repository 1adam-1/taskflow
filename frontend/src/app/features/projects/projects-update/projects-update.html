<section class="update-project-page">
  <h1>Update Project " {{ project?.name }} "</h1>

  @if(successMsg()){
    <p class="success-message">{{ successMsg() }}</p>
  }

    @if(errorMsg()){
        <p class="error-message">{{ errorMsg() }}</p>
    }

  <form class="project-form" [formGroup]="UpdateProjectForm" (ngSubmit)="updateProject()">
    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" id="name" formControlName="name" class="form-control">
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <textarea id="description" formControlName="description" class="form-control"></textarea>
    </div>

    <div class="form-group">
      <label for="startDate">Start Date</label>
      <input type="date" id="startDate" formControlName="startDate" class="form-control">
    </div>

    <div class="form-group">
      <label for="endDate">End Date</label>
      <input type="date" id="endDate" formControlName="endDate" class="form-control">
    </div>

    <div class="form-group">
      <label for="status">Status</label>
      <select id="status" formControlName="status" class="form-control">
        <option value="PLANNED">Planned</option>
        <option value="IN_PROGRESS">In Progress</option>
        <option value="ON_HOLD">On Hold</option>
        <option value="COMPLETED">Completed</option>
        <option value="CANCELLED">Cancelled</option>
      </select>
    </div>

    <button type="submit" class="submit-button">Update Project</button>
  </form>
</section>
